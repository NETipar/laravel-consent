name: Bug report
description: Report a bug in laravel-consent
labels: ["bug", "needs-triage"]
body:
  - type: input
    id: consent-version
    attributes:
      label: laravel-consent version
      placeholder: "0.14.0"
    validations:
      required: true
  - type: input
    id: laravel-version
    attributes:
      label: Laravel version
      placeholder: "12.0.0"
    validations:
      required: true
  - type: input
    id: php-version
    attributes:
      label: PHP version
      placeholder: "8.4.0"
    validations:
      required: true
  - type: dropdown
    id: frontend
    attributes:
      label: Frontend integration
      options:
        - None (HTTP only)
        - Vue 3
        - Alpine.js
        - Livewire
        - Custom (using @netipar/consent-core directly)
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: A minimal reproduction. Code snippets or a link to a repo. The smaller the better.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Include error messages, stack traces, network requests as relevant.
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Relevant config
      description: |
        Any non-default `config/consent.php` settings (especially `version`, `cookie.*`,
        `categories`, `google.*`, `log.*`).
      render: php
