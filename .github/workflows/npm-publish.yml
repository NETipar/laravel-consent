name: Publish npm packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v0.17.0)'
        required: true
        type: string

permissions:
  contents: read
  id-token: write  # npm trusted publishing (OIDC) and provenance attestations

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      # Trusted publishing needs npm >= 11.5.1 and Node >= 22.14 (Node 24 ships npm 11).
      # No registry-url: its generated .npmrc injects a NODE_AUTH_TOKEN
      # placeholder, and publishing authenticates through OIDC instead.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify version sync
        run: |
          set -euo pipefail
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          EXPECTED="${TAG#v}"
          for pkg in packages/*/package.json; do
            ACTUAL=$(node -p "require('./${pkg}').version")
            if [ "$ACTUAL" != "$EXPECTED" ]; then
              echo "::error::Version mismatch in ${pkg}: expected ${EXPECTED}, got ${ACTUAL}"
              exit 1
            fi
          done
          echo "All package versions match ${EXPECTED}."

      - name: Type-check
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Build packages
        run: pnpm -r run build

      - name: Check npm supports trusted publishing
        run: |
          set -euo pipefail
          NPM_VERSION=$(npm --version)
          if [ "$(printf '%s\n' 11.5.1 "$NPM_VERSION" | sort -V | head -n1)" != "11.5.1" ]; then
            echo "::error::npm ${NPM_VERSION} cannot publish with trusted publishing (needs >= 11.5.1)."
            exit 1
          fi
          echo "npm ${NPM_VERSION}"

      # pnpm pack rewrites the workspace:^ ranges; npm publishes the tarballs
      # through trusted publishing (OIDC, configured per package on npmjs.com
      # for this workflow file), so no NPM_TOKEN secret is involved.
      - name: Pack packages
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/npm-pack"
          for pkg in core alpine vue3; do
            (cd "packages/${pkg}" && pnpm pack --pack-destination "$RUNNER_TEMP/npm-pack")
          done
          ls -l "$RUNNER_TEMP/npm-pack"

      - name: Publish packages (trusted publishing, provenance)
        run: |
          set -euo pipefail
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          VERSION="${TAG#v}"
          # Core first: the adapters depend on it. A version already on npm is
          # skipped, so a partly failed run can simply be re-run.
          for pkg in core alpine vue3; do
            NAME="@netipar/consent-${pkg}"
            if npm view "${NAME}@${VERSION}" version > /dev/null 2>&1; then
              echo "${NAME}@${VERSION} is already published, skipping."
              continue
            fi
            npm publish "$RUNNER_TEMP/npm-pack/netipar-consent-${pkg}-${VERSION}.tgz" --access public --provenance
          done
