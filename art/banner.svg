<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628"/>
      <stop offset="50%" style="stop-color:#0d2137"/>
      <stop offset="100%" style="stop-color:#112d4e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f97316"/>
      <stop offset="100%" style="stop-color:#fbbf24"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.03" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="80" x2="1280" y2="80"/>
    <line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="0" y1="320" x2="1280" y2="320"/>
    <line x1="0" y1="400" x2="1280" y2="400"/>
    <line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="0" y1="560" x2="1280" y2="560"/>
    <line x1="160" y1="0" x2="160" y2="640"/>
    <line x1="320" y1="0" x2="320" y2="640"/>
    <line x1="480" y1="0" x2="480" y2="640"/>
    <line x1="640" y1="0" x2="640" y2="640"/>
    <line x1="800" y1="0" x2="800" y2="640"/>
    <line x1="960" y1="0" x2="960" y2="640"/>
    <line x1="1120" y1="0" x2="1120" y2="640"/>
  </g>

  <!-- Decorative cookie with a bite (left) -->
  <g transform="translate(120, 200)" opacity="0.07">
    <circle cx="115" cy="115" r="110" fill="#ffffff"/>
    <circle cx="205" cy="45" r="36" fill="#0a1628"/>
    <circle cx="228" cy="96" r="26" fill="#0a1628"/>
    <circle cx="176" cy="8" r="22" fill="#0a1628"/>
    <circle cx="68" cy="78" r="13" fill="#0a1628"/>
    <circle cx="124" cy="152" r="15" fill="#0a1628"/>
    <circle cx="60" cy="152" r="10" fill="#0a1628"/>
    <circle cx="122" cy="86" r="8" fill="#0a1628"/>
    <circle cx="172" cy="136" r="9" fill="#0a1628"/>
  </g>

  <!-- Decorative shield with a check (right) -->
  <g transform="translate(970, 190)" opacity="0.06">
    <path d="M90 0 L180 36 V110 C180 170 140 205 90 220 C40 205 0 170 0 110 V36 Z" fill="#ffffff"/>
    <polyline points="48,112 80,144 136,84" fill="none" stroke="#0a1628" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Accent line -->
  <rect x="440" y="200" width="80" height="4" rx="2" fill="url(#accent)"/>

  <!-- Package name -->
  <text x="640" y="270" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="72" font-weight="700" fill="#ffffff" letter-spacing="-2">Consent for Laravel</text>

  <!-- Tagline -->
  <text x="640" y="330" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" fill="#8899aa" letter-spacing="1">Headless cookie consent · your markup, our behaviour</text>

  <!-- Feature pills -->
  <g transform="translate(640, 385)" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="500">
    <rect x="-373" y="-16" width="100" height="32" rx="16" fill="#f97316" fill-opacity="0.15" stroke="#f97316" stroke-opacity="0.3" stroke-width="1"/>
    <text x="-323" y="5" fill="#fcd34d">Opt-in</text>

    <rect x="-259" y="-16" width="140" height="32" rx="16" fill="#f97316" fill-opacity="0.15" stroke="#f97316" stroke-opacity="0.3" stroke-width="1"/>
    <text x="-189" y="5" fill="#fcd34d">Consent Mode v2</text>

    <rect x="-105" y="-16" width="116" height="32" rx="16" fill="#f97316" fill-opacity="0.15" stroke="#f97316" stroke-opacity="0.3" stroke-width="1"/>
    <text x="-47" y="5" fill="#fcd34d">Consent log</text>

    <rect x="25" y="-16" width="120" height="32" rx="16" fill="#f97316" fill-opacity="0.15" stroke="#f97316" stroke-opacity="0.3" stroke-width="1"/>
    <text x="85" y="5" fill="#fcd34d">Cookie table</text>

    <rect x="159" y="-16" width="100" height="32" rx="16" fill="#f97316" fill-opacity="0.15" stroke="#f97316" stroke-opacity="0.3" stroke-width="1"/>
    <text x="209" y="5" fill="#fcd34d">Alpine</text>

    <rect x="273" y="-16" width="100" height="32" rx="16" fill="#f97316" fill-opacity="0.15" stroke="#f97316" stroke-opacity="0.3" stroke-width="1"/>
    <text x="323" y="5" fill="#fcd34d">Vue 3</text>
  </g>

  <!-- NETipar text branding -->
  <g transform="translate(640, 460)" text-anchor="middle" opacity="0.3">
    <text x="0" y="0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="600" fill="#ffffff" letter-spacing="3">NETipar</text>
  </g>

  <!-- Bottom bar -->
  <rect x="0" y="630" width="1280" height="10" fill="url(#accent)"/>
</svg>
